[project]
name = "agent-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omzirpe2006", email = "omzirpe2003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chroma>=0.2.0",
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.27.0",
]

[project.scripts]
agent-db = "agent_db:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
